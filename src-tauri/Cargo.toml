[package]
name = "stream-to-my-tv"
version = "1.0.0"
description = "Stream to My TV native Tauri v2 desktop host"
edition = "2021"

[lib]
name = "stream_to_my_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
